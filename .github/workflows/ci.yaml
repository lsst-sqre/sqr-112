name: CI

'on': [push, pull_request, workflow_dispatch]

jobs:
  call-workflow:
    uses: lsst-sqre/rubin-sphinx-technote-workflows/.github/workflows/ci.yaml@v1
    with:
      handle: sqr-112
    secrets:
      ltd_username: ${{ secrets.LTD_USERNAME }}
      ltd_password: ${{ secrets.LTD_PASSWORD }}

  docverse-upload:
    # Test uploading the build to the Docverse dev server.
    needs: call-workflow
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history for metadata
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v8

      - name: Build technote
        run: uv run tox run -e html

      - name: Upload to Docverse
        id: docverse
        uses: lsst-sqre/docverse-upload@tickets/DM-54686
        with:
          org: jsc-test-20260409
          project: sqr-112
          dir: _build/html
          token: ${{ secrets.DOCVERSE_TOKEN }}
          base-url: https://roundtable-dev.lsst.cloud/docverse/api

      - name: Report Docverse build
        run: |
          echo "build-url: ${{ steps.docverse.outputs.build-url }}"
          echo "published-url: ${{ steps.docverse.outputs.published-url }}"
          echo "job-status: ${{ steps.docverse.outputs.job-status }}"
